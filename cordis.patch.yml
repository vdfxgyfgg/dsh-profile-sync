# ============================================================================
# dsh-profile-sync —— DSH bundle patch（插件自带的挂载声明）
# ============================================================================
# 装上之后，profile 只要在 `dsh.profile.bundles` 里列出本包名即生效：
#
#   dsh plugin --profile desktop add \
#     https://raw.githubusercontent.com/vdfxgyfgg/dsh-profile-sync/main/dist/dsh-profile-sync.tgz
# ============================================================================

- insert:
    - id: profile-sync        # ⭐ 必须等于命名空间名（index.js 里的 export const name）
      name: dsh-profile-sync
